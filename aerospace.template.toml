# ЭТОТ ФАЙЛ — ШАБЛОН. Реальный ~/.aerospace.toml генерируется из него скриптом
# ~/.aerospace-render.sh (там же, вверху скрипта — переменные с именами воркспейсов).
# Правь ИМЕНА воркспейсов только в render-скрипте, а логику/хоткеи/правила — здесь,
# используя плейсхолдеры __WS_MAIN__ / __WS_OTHER__ / __WS_CODING__ / __WS_SEARCH__
# вместо конкретных имён. После правки шаблона запусти: ~/.aerospace-render.sh
#
# Плейсхолдеры именованы по РОЛИ воркспейса, а не по позиции — потому что физическая
# клавиша (m/o/c/s) и порядок в группировке/цикле cmd-j/cmd-k теперь независимы друг
# от друга (см. persistent-workspaces и cmd-j/cmd-k ниже).

# Версия конфигурации для совместимости и устаревших параметров
# См.: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Значение по умолчанию (если параметр не указан): config-version = 1
config-version = 2

# Здесь можно указать команды, которые выполняются после запуска AeroSpace.
# Доступные команды: https://nikitabobko.github.io/AeroSpace/commands
# Просто открываем приложения — на нужный воркспейс их раскидают правила
# on-window-detected ниже (те же правила, что ловят и ручной запуск).
after-startup-command = [
    'exec-and-forget open -a "Twilight"',
    'exec-and-forget open -a "Happ"',
    # main — основной воркспейс: фокус после логина должен оказаться именно на нём,
    # даже если он не первый в persistent-workspaces/группировке ниже.
    'workspace __WS_MAIN__',
]

# Запускать AeroSpace при входе в систему
start-at-login = true

# Автоматически перезагружать конфигурацию после сохранения файла
# После установки значения true один раз перезагрузите конфигурацию вручную, чтобы включить автоматическую перезагрузку
auto-reload-config = true

# Нормализация. См.: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# См.: https://nikitabobko.github.io/AeroSpace/guide#layouts
# 'accordion-padding' задаёт размер отступа в режиме аккордеона
# Установите 0, чтобы отключить отступ
accordion-padding = 0

# Возможные значения: tiles|accordion
# 'accordion' + accordion-padding = 0 ниже даёт поведение "окна друг за другом на весь
# экран", без авто-деления по горизонтали/вертикали — переключение между ними см. alt-tab.
default-root-container-layout = 'accordion'

# Возможные значения: horizontal|vertical|auto
# 'auto' означает: широкий монитор (ширина больше высоты) получает горизонтальную ориентацию,
#               высокий монитор (высота больше ширины) получает вертикальную ориентацию
default-root-container-orientation = 'auto'

# Курсор мыши перемещается вслед за фокусом при смене активного монитора
# Удалите этот параметр из конфигурации, если вам не нравится такое поведение
# См. https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# См. https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Значение по умолчанию (если параметр не указан): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Этот параметр позволяет фактически отключить функцию macOS «Скрыть приложение» (cmd-h)
# Полезно, если вы не используете эту функцию macOS, но случайно нажимаете cmd-h или cmd-alt-h
# Также см.: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Список рабочих пространств, которые должны существовать даже без окон,
# в том числе когда они невидимы.
# Этот параметр доступен только начиная с 'config-version = 2'
# Значение по умолчанию (если параметр не указан): persistent-workspaces = []
# persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "A", "B",
#                         "C", "D", "E", "F", "G", "I", "M", "N", "O", "P", "Q",
#                         "R", "S", "T", "U", "V", "W", "X", "Y", "Z"]
# 4 воркспейса, переключаются через ctrl-s/c/m/o (см. [mode.main.binding] ниже) —
# физические клавиши НЕ зависят от имени воркспейса, менять их не нужно при переименовании.
# Порядок в списке ниже — это порядок группировки/цикла cmd-j/cmd-k (search → coding →
# main → other), а НЕ порядок физических клавиш и НЕ алфавит (по умолчанию AeroSpace
# сам крутит workspace next/prev по алфавиту — здесь этот порядок переопределён явно,
# см. cmd-j/cmd-k в [mode.main.binding]).
persistent-workspaces = ["__WS_SEARCH__", "__WS_CODING__", "__WS_MAIN__", "__WS_OTHER__"]

# Все окна открываются как floating (не управляются тайлингом/accordion) — благодаря
# этому Rectangle может свободно resize/двигать их, и aerospace никогда не "отжимает"
# размер обратно. accordion остаётся настроен ниже на случай, если решите вернуть тайлинг
# для части приложений через отдельные [[on-window-detected]] правила с if.app-id.
#
# ВАЖНО: срабатывает только ПЕРВОЕ совпавшее правило (AeroSpace останавливает обработку
# после первого match, если не указан check-further-callbacks = true). Поэтому привязки
# конкретных приложений к воркспейсам стоят выше общего "layout floating для всех" —
# иначе до них просто не доходило бы дело. Правило срабатывает одинаково и для окна,
# открытого при старте системы (см. after-startup-command выше), и для окна, которое
# приложение открыло само по себе — источник не важен, важен только app-bundle-id.
on-window-detected = [
    # __WS_MAIN__: Twilight (Zen Browser)
    { if = 'test %{app-bundle-id} = app.zen-browser.zen', run = ['layout floating', 'move-node-to-workspace __WS_MAIN__'] },
    # __WS_OTHER__: Happ, Telegram, Spotify
    { if = 'test %{app-bundle-id} = com.happ.www', run = ['layout floating', 'move-node-to-workspace __WS_OTHER__'] },
    { if = 'test %{app-bundle-id} = ru.keepcoder.Telegram', run = ['layout floating', 'move-node-to-workspace __WS_OTHER__'] },
    { if = 'test %{app-bundle-id} = com.spotify.client', run = ['layout floating', 'move-node-to-workspace __WS_OTHER__'] },
    # Всё остальное — просто floating, без привязки к воркспейсу
    { if = 'true', run = 'layout floating' },
]

# Callback, который выполняется каждый раз при изменении режима привязок клавиш
# См.: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# См.: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

focus-follows-mouse.enabled = false

# Возможные значения: (qwerty|dvorak|colemak)
# См. https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Отступы между окнами (inner-*) и между краями монитора (outer-*).
# Возможные значения:
# - Постоянное значение: gaps.outer.top = 4
# - Для каждого монитора: gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 В этом примере 24 — значение по умолчанию, если совпадение не найдено.
#                 Шаблон монитора такой же, как для 'workspace-to-monitor-force-assignment'.
#                 См.:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
gaps.inner.horizontal = 0
gaps.inner.vertical =   0
gaps.outer.left =       0
gaps.outer.bottom =     0
gaps.outer.top =        0
gaps.outer.right =      0

# Объявление режима привязок 'main'
# См.: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# Режим привязок 'main' должен присутствовать всегда
# Значение по умолчанию (если параметр не указан): mode.main.binding = {}
[mode.main.binding]

    # Все возможные клавиши:
    # - Буквы.         a, b, c, ..., z
    # - Цифры.          0, 1, 2, ..., 9
    # - Цифры на NumPad. keypad0, keypad1, keypad2, ..., keypad9
    # - F-клавиши.      f1, f2, ..., f20
    # - Специальные клавиши. minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (только для ISO-клавиатур, только для европейских клавиатур)
    # - Специальные клавиши NumPad. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Стрелки.        left, down, up, right

    # Все возможные модификаторы: cmd, alt, ctrl, shift

    # Все доступные команды: https://nikitabobko.github.io/AeroSpace/commands

    # См.: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # Можно раскомментировать следующие строки, чтобы открывать терминал сочетанием alt + enter
    # (как в i3)
    # alt-enter = '''exec-and-forget osascript -e \
    # 'tell application "Terminal" to tell (do script) to activate' '''

    # См.: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # См.: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # См.: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # См.: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # См.: https://nikitabobko.github.io/AeroSpace/commands#workspace
    # ВНИМАНИЕ: ctrl-c глобально перехватывает Ctrl+C у ВСЕХ приложений, включая
    # терминалы (там Ctrl+C — это SIGINT, прерывание процесса). Осознанный выбор по
    # просьбе — как и ctrl-d/ctrl-f, которые тоже пересекаются с readline-биндингами.
    # Физические клавиши фиксированы и НЕ зависят от того, как воркспейс называется
    # сейчас — имя подставляется из переменных __WS_*__ при генерации.
    ctrl-s = 'workspace __WS_SEARCH__'
    ctrl-c = 'workspace __WS_CODING__'
    ctrl-m = 'workspace __WS_MAIN__'
    ctrl-o = 'workspace __WS_OTHER__'

    # См.: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    ctrl-shift-s = 'move-node-to-workspace __WS_SEARCH__'
    ctrl-shift-c = 'move-node-to-workspace __WS_CODING__'
    ctrl-shift-m = 'move-node-to-workspace __WS_MAIN__'
    ctrl-shift-o = 'move-node-to-workspace __WS_OTHER__'

    # Переключение между окнами внутри воркспейса (как обычный alt+tab в ОС).
    # default-root-container-layout = 'accordion' + accordion-padding = 0 уже даёт
    # поведение "окна друг за другом на весь экран", это только цикличная навигация по ним.
    # См.: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-tab = 'focus --wrap-around dfs-next'
    alt-shift-tab = 'focus --wrap-around dfs-prev'

    # Было на alt-shift-tab — перенесено сюда, чтобы не конфликтовать с переключением окон выше.
    # См.: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-m = 'move-workspace-to-monitor --wrap-around next'

    # Переключение воркспейсов вперёд/назад по кругу (аналог cmd+j/k из Rectangle,
    # но самодостаточное — не зависит от внешних тулов, переживёт переезд на другой Mac).
    # По умолчанию AeroSpace крутит workspace next/prev по АЛФАВИТУ, что не совпадает
    # с нужной группировкой (search, coding, main, other) — поэтому вместо лёгкой
    # встроенной команды передаём явный порядок через --stdin: cmd-j = index-1 (prev),
    # cmd-k = index+1 (next), с переносом через край (--wrap-around).
    # См.: https://nikitabobko.github.io/AeroSpace/commands#workspace
    cmd-j = '''exec-and-forget /bin/sh -c "printf '__WS_SEARCH__\n__WS_CODING__\n__WS_MAIN__\n__WS_OTHER__\n' | /opt/homebrew/bin/aerospace workspace prev --stdin --wrap-around"'''
    cmd-k = '''exec-and-forget /bin/sh -c "printf '__WS_SEARCH__\n__WS_CODING__\n__WS_MAIN__\n__WS_OTHER__\n' | /opt/homebrew/bin/aerospace workspace next --stdin --wrap-around"'''

    # ctrl-shift-j / ctrl-shift-k сознательно НЕ забиндены здесь.
    # AeroSpace не умеет resize в процентах и не двигает/центрирует окна — только
    # tiling-разбиение и абсолютные пиксели. "Центр 80%" и "100% на весь экран" остаются
    # хоткеями Rectangle как есть — эти комбинации просто проходят мимо aerospace к Rectangle
    # без конфликта. Все окна теперь floating (см. on-window-detected выше), поэтому
    # aerospace больше не отжимает размер обратно после ресайза — работает сразу, без
    # ручного alt-shift-space перед каждым ресайзом.

    # См.: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

    alt-shift-space = 'layout floating tiling'

# Объявление режима привязок 'service'.
# См.: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # сбросить раскладку
    f = ['layout floating tiling', 'mode main'] # Переключение между плавающей и мозаичной раскладкой
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky пока не поддерживается https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
