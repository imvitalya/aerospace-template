# AeroSpace template
# Имена воркспейсов подставляются через ~/.aerospace-render.sh.
# После изменения шаблона запускай: ~/.aerospace-render.sh
#
# Положение внешних экранов определяется по системной расстановке macOS.

config-version = 2
start-at-login = true
auto-reload-config = true

after-startup-command = [
    'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" startup __WS_MAIN__',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

# Отдельного события о подключении мониторов в AeroSpace нет,
# поэтому раскладку окон проверяем хотя бы при смене монитора с фокусом.
on-focused-monitor-changed = [
    'move-mouse monitor-lazy-center',
    'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" sync',
]
automatically-unhide-macos-hidden-apps = true

# Постоянные пространства подключенных внешних мониторов.
persistent-workspaces = [__WS_PERSISTENT__]

# Все окна по умолчанию плавающие.
# При необходимости правила конкретных приложений можно добавить выше fallback.
on-window-detected = [
    # Примеры привязки приложений к воркспейсам:
    # { if = 'test %{app-bundle-id} = app.zen-browser.zen', run = ['layout floating', 'move-node-to-workspace __WS_MAIN____WS_FIRST_SUFFIX__'] },
    # { if = 'test %{app-bundle-id} = com.happ.www', run = ['layout floating', 'move-node-to-workspace __WS_OTHER____WS_FIRST_SUFFIX__'] },
    # { if = 'test %{app-bundle-id} = ru.keepcoder.Telegram', run = ['layout floating', 'move-node-to-workspace __WS_OTHER____WS_FIRST_SUFFIX__'] },
    # { if = 'test %{app-bundle-id} = com.spotify.client', run = ['layout floating', 'move-node-to-workspace __WS_OTHER____WS_FIRST_SUFFIX__'] },

    { if = 'true', run = 'layout floating' },
]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical = 0
gaps.outer.left = 0
gaps.outer.bottom = 0
gaps.outer.top = 0
gaps.outer.right = 0

# Таблицы ([...]) должны идти после всех корневых ключей:
# всё, что ниже заголовка таблицы, попадает внутрь неё.

[workspace-to-monitor-force-assignment]
__WS_ASSIGNMENTS__

[mode.main.binding]

# Раскладка окон
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Фокус между окнами
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Перемещение окон внутри раскладки
# (alt-shift-h занят переносом окна в hacking на правом/нижнем экране)
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Перенос по оси расстановки внешних мониторов
ctrl-alt-j = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" adjacent next'
ctrl-alt-k = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" adjacent prev'

# Перенос на встроенный, левый/верхний или правый/нижний монитор
ctrl-alt-1 = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" to-monitor mac'
ctrl-alt-2 = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" to-monitor __WS_FIRST_KEY__'
ctrl-alt-3 = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" to-monitor __WS_SECOND_KEY__'

# Изменение размера
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Без внешних мониторов обе группы клавиш ведут в *-mac.

# Перейти на воркспейс: cmd+ctrl — левый/верхний монитор, cmd+shift — правый/нижний
ctrl-cmd-s = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" focus __WS_INTERESTING__ __WS_FIRST_KEY__'
ctrl-cmd-h = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" focus __WS_HACKING__ __WS_FIRST_KEY__'
ctrl-cmd-m = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" focus __WS_MAIN__ __WS_FIRST_KEY__'
ctrl-cmd-o = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" focus __WS_OTHER__ __WS_FIRST_KEY__'

cmd-shift-i = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" focus __WS_INTERESTING__ __WS_SECOND_KEY__'
cmd-shift-h = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" focus __WS_HACKING__ __WS_SECOND_KEY__'
cmd-shift-m = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" focus __WS_MAIN__ __WS_SECOND_KEY__'
cmd-shift-o = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" focus __WS_OTHER__ __WS_SECOND_KEY__'

# Перенести активное окно на воркспейс: opt+ctrl — левый/верхний монитор, opt+shift — правый/нижний
ctrl-alt-s = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" move __WS_INTERESTING__ __WS_FIRST_KEY__'
ctrl-alt-h = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" move __WS_HACKING__ __WS_FIRST_KEY__'
ctrl-alt-m = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" move __WS_MAIN__ __WS_FIRST_KEY__'
ctrl-alt-o = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" move __WS_OTHER__ __WS_FIRST_KEY__'

alt-shift-s = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" move __WS_INTERESTING__ __WS_SECOND_KEY__'
alt-shift-h = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" move __WS_HACKING__ __WS_SECOND_KEY__'
alt-shift-m = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" move __WS_MAIN__ __WS_SECOND_KEY__'
alt-shift-o = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" move __WS_OTHER__ __WS_SECOND_KEY__'

# Циклическое переключение пространств слева/сверху: Cmd+J / Cmd+K
cmd-j = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" cycle prev __WS_FIRST_KEY__ __WS_INTERESTING__ __WS_HACKING__ __WS_MAIN__ __WS_OTHER__'
cmd-k = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" cycle next __WS_FIRST_KEY__ __WS_INTERESTING__ __WS_HACKING__ __WS_MAIN__ __WS_OTHER__'

# Циклическое переключение пространств справа/снизу: Ctrl+Option+Cmd+J / K
ctrl-alt-cmd-j = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" cycle prev __WS_SECOND_KEY__ __WS_INTERESTING__ __WS_HACKING__ __WS_MAIN__ __WS_OTHER__'
ctrl-alt-cmd-k = 'exec-and-forget /bin/bash "$HOME/.aerospace-ws.sh" cycle next __WS_SECOND_KEY__ __WS_INTERESTING__ __WS_HACKING__ __WS_MAIN__ __WS_OTHER__'

# Переключение между окнами
alt-tab = 'focus --wrap-around dfs-next'
alt-shift-tab = 'focus --wrap-around dfs-prev'

# Сервисный режим
alt-shift-semicolon = 'mode service'
alt-shift-space = 'layout floating tiling'

[mode.service.binding]
  esc = ['reload-config', 'mode main']
  r = ['flatten-workspace-tree', 'mode main']
  f = ['layout floating tiling', 'mode main']
  backspace = ['close-all-windows-but-current', 'mode main']

  alt-shift-h = ['join-with left', 'mode main']
  alt-shift-j = ['join-with down', 'mode main']
  alt-shift-k = ['join-with up', 'mode main']
  alt-shift-l = ['join-with right', 'mode main']
