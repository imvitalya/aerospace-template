# AeroSpace template
# Имена воркспейсов подставляются через ~/.aerospace-render.sh.
# После изменения шаблона запускай: ~/.aerospace-render.sh
#
# Переходы между воркспейсами идут через ~/.aerospace-ws.sh: он смотрит,
# какие мониторы подключены, и без внешних мониторов собирает окна
# из *-top и *-bottom в *-mac, а при их возврате раскладывает обратно.

config-version = 2
start-at-login = true
auto-reload-config = true

after-startup-command = [
    'exec-and-forget /bin/bash __WS_SCRIPT__ startup __WS_MAIN__',
    # Индикатор в меню-баре: только воркспейс с фокусом, без звёздочки
    # (~/.aerospace-indicator.swift, собирается в ~/.aerospace-render.sh)
    'exec-and-forget __WS_INDICATOR__',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

# Отдельного события о подключении мониторов в AeroSpace нет,
# поэтому раскладку окон проверяем хотя бы при смене монитора с фокусом.
on-focused-monitor-changed = [
    'move-mouse monitor-lazy-center',
    'exec-and-forget /bin/bash __WS_SCRIPT__ sync',
]
automatically-unhide-macos-hidden-apps = true

# Восемь постоянных воркспейсов: по четыре на каждый внешний монитор.
# *-mac сюда не входят: без встроенного экрана AeroSpace показывал бы их
# на внешних мониторах. Они создаются, когда нужны, и исчезают пустыми.
persistent-workspaces = [
    "__WS_SEARCH__-top",
    "__WS_HACKING__-top",
    "__WS_MAIN__-top",
    "__WS_OTHER__-top",
    "__WS_SEARCH__-bottom",
    "__WS_HACKING__-bottom",
    "__WS_MAIN__-bottom",
    "__WS_OTHER__-bottom",
]

# Все окна по умолчанию плавающие.
# При необходимости правила конкретных приложений можно добавить выше fallback.
on-window-detected = [
    # Примеры привязки приложений к воркспейсам:
    # { if = 'test %{app-bundle-id} = app.zen-browser.zen', run = ['layout floating', 'move-node-to-workspace __WS_MAIN__-top'] },
    # { if = 'test %{app-bundle-id} = com.happ.www', run = ['layout floating', 'move-node-to-workspace __WS_OTHER__-top'] },
    # { if = 'test %{app-bundle-id} = ru.keepcoder.Telegram', run = ['layout floating', 'move-node-to-workspace __WS_OTHER__-top'] },
    # { if = 'test %{app-bundle-id} = com.spotify.client', run = ['layout floating', 'move-node-to-workspace __WS_OTHER__-top'] },

    { if = 'true', run = 'layout floating' },
]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical = 0
gaps.outer.left = 0
gaps.outer.bottom = 0
gaps.outer.top = 0
gaps.outer.right = 0

# Таблицы ([...]) должны идти после всех корневых ключей:
# всё, что ниже заголовка таблицы, попадает внутрь неё.

# Монитор 1 — верхний, монитор 2 — нижний: номера идут по расположению мониторов.
# Встроенный экран ищется по имени (регулярка без учёта регистра;
# «встроен» — на случай русской локализации macOS).
# Проверь соответствие через `aerospace list-monitors`.
[workspace-to-monitor-force-assignment]
  "__WS_SEARCH__-top" = 1
  "__WS_HACKING__-top" = 1
  "__WS_MAIN__-top" = 1
  "__WS_OTHER__-top" = 1

  "__WS_SEARCH__-bottom" = 2
  "__WS_HACKING__-bottom" = 2
  "__WS_MAIN__-bottom" = 2
  "__WS_OTHER__-bottom" = 2

  "__WS_SEARCH__-mac" = 'built-in|встроен'
  "__WS_HACKING__-mac" = 'built-in|встроен'
  "__WS_MAIN__-mac" = 'built-in|встроен'
  "__WS_OTHER__-mac" = 'built-in|встроен'

[mode.main.binding]

# Раскладка окон
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Фокус между окнами
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Перемещение окон внутри раскладки
# (alt-shift-h занят переносом окна в hacking-bottom — см. ниже)
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Перенос активного окна между вертикально расположенными мониторами
ctrl-alt-j = 'move-node-to-monitor down'
ctrl-alt-k = 'move-node-to-monitor up'

# Перенос активного окна на монитор: 1 — ноутбук, 2 — верхний, 3 — нижний
ctrl-alt-1 = 'exec-and-forget /bin/bash __WS_SCRIPT__ to-monitor mac'
ctrl-alt-2 = 'exec-and-forget /bin/bash __WS_SCRIPT__ to-monitor top'
ctrl-alt-3 = 'exec-and-forget /bin/bash __WS_SCRIPT__ to-monitor bottom'

# Изменение размера
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Без внешних мониторов и верхние, и нижние хоткеи ведут в *-mac.

# Перейти на воркспейс: cmd+ctrl — верхний монитор, cmd+shift — нижний
ctrl-cmd-s = 'exec-and-forget /bin/bash __WS_SCRIPT__ focus __WS_SEARCH__ top'
ctrl-cmd-h = 'exec-and-forget /bin/bash __WS_SCRIPT__ focus __WS_HACKING__ top'
ctrl-cmd-m = 'exec-and-forget /bin/bash __WS_SCRIPT__ focus __WS_MAIN__ top'
ctrl-cmd-o = 'exec-and-forget /bin/bash __WS_SCRIPT__ focus __WS_OTHER__ top'

cmd-shift-s = 'exec-and-forget /bin/bash __WS_SCRIPT__ focus __WS_SEARCH__ bottom'
cmd-shift-h = 'exec-and-forget /bin/bash __WS_SCRIPT__ focus __WS_HACKING__ bottom'
cmd-shift-m = 'exec-and-forget /bin/bash __WS_SCRIPT__ focus __WS_MAIN__ bottom'
cmd-shift-o = 'exec-and-forget /bin/bash __WS_SCRIPT__ focus __WS_OTHER__ bottom'

# Перенести активное окно на воркспейс: opt+ctrl — верхний монитор, opt+shift — нижний
ctrl-alt-s = 'exec-and-forget /bin/bash __WS_SCRIPT__ move __WS_SEARCH__ top'
ctrl-alt-h = 'exec-and-forget /bin/bash __WS_SCRIPT__ move __WS_HACKING__ top'
ctrl-alt-m = 'exec-and-forget /bin/bash __WS_SCRIPT__ move __WS_MAIN__ top'
ctrl-alt-o = 'exec-and-forget /bin/bash __WS_SCRIPT__ move __WS_OTHER__ top'

alt-shift-s = 'exec-and-forget /bin/bash __WS_SCRIPT__ move __WS_SEARCH__ bottom'
alt-shift-h = 'exec-and-forget /bin/bash __WS_SCRIPT__ move __WS_HACKING__ bottom'
alt-shift-m = 'exec-and-forget /bin/bash __WS_SCRIPT__ move __WS_MAIN__ bottom'
alt-shift-o = 'exec-and-forget /bin/bash __WS_SCRIPT__ move __WS_OTHER__ bottom'

# Циклическое переключение верхних воркспейсов: Cmd+J / Cmd+K
cmd-j = 'exec-and-forget /bin/bash __WS_SCRIPT__ cycle prev top __WS_SEARCH__ __WS_HACKING__ __WS_MAIN__ __WS_OTHER__'
cmd-k = 'exec-and-forget /bin/bash __WS_SCRIPT__ cycle next top __WS_SEARCH__ __WS_HACKING__ __WS_MAIN__ __WS_OTHER__'

# Циклическое переключение нижних воркспейсов: Ctrl+Option+Cmd+J / K
ctrl-alt-cmd-j = 'exec-and-forget /bin/bash __WS_SCRIPT__ cycle prev bottom __WS_SEARCH__ __WS_HACKING__ __WS_MAIN__ __WS_OTHER__'
ctrl-alt-cmd-k = 'exec-and-forget /bin/bash __WS_SCRIPT__ cycle next bottom __WS_SEARCH__ __WS_HACKING__ __WS_MAIN__ __WS_OTHER__'

# Переключение между окнами
alt-tab = 'focus --wrap-around dfs-next'
alt-shift-tab = 'focus --wrap-around dfs-prev'

# Сервисный режим
alt-shift-semicolon = 'mode service'
alt-shift-space = 'layout floating tiling'

[mode.service.binding]
  esc = ['reload-config', 'mode main']
  r = ['flatten-workspace-tree', 'mode main']
  f = ['layout floating tiling', 'mode main']
  backspace = ['close-all-windows-but-current', 'mode main']

  alt-shift-h = ['join-with left', 'mode main']
  alt-shift-j = ['join-with down', 'mode main']
  alt-shift-k = ['join-with up', 'mode main']
  alt-shift-l = ['join-with right', 'mode main']
